name: DevSecOps Security Guardrails

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Avoid hardcoding API keys or passwords in the code
  secret-scanning:
    name: 1. Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Check Terraform (GCP/GKE) configuration for overly permissive settings or security vulnerabilities
  iac-security-scan:
    name: 2. Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          # 僅在發現 HIGH 或 CRITICAL 級別漏洞時阻擋合併，避免過度干擾開發
          soft_fail: false
          check: CKV_GCP_24,CKV_GCP_25,CKV_GCP_61

  # 3. Scan Roboflow inference container images for high-risk OS/package vulnerabilities
  container-vulnerability-scan:
    name: 3. Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'roboflow/roboflow-inference-server-cpu:latest'
          format: 'table'
          exit-code: '0' # find CRITICAL vulnerabilities to fail the pipeline and demonstrate security gating
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
 